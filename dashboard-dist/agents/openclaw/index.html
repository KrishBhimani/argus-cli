<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenClaw — Argus</title><link rel="stylesheet" href="/styles/global.css"></head> <body> <header class="app-header"> <a href="/" class="brand">ARGUS<span class="dot">●</span></a> <nav class="app-nav"> <a href="/" class>Overview</a> <a href="/sessions" class>Sessions</a> <a href="/tools" class>Tools</a> <a href="/trends" class>Trends</a> <a href="/models" class>Models</a> <details class="nav-dropdown active" id="agents-dropdown"> <summary>Agents <span class="caret">▾</span></summary> <div class="nav-dropdown-menu" id="agents-menu"> <span class="nav-dropdown-loading">Loading…</span> </div> </details> <a href="/prompts" class>Prompts</a> <a href="/settings" class>Settings</a> </nav> <div class="agent-picker-wrapper" id="agent-picker-wrapper" data-on-agent-page="1"> <button class="agent-picker-toggle" id="agent-picker-toggle" aria-haspopup="listbox" aria-expanded="false"> <span class="agent-picker-label" id="agent-picker-label">Agent: All</span> <span class="caret">▾</span> </button> <div class="agent-picker-menu" id="agent-picker-menu" hidden> <div class="agent-picker-loading">Loading…</div> </div> </div> </header> <main> <h1 style="margin-bottom: 0.4rem;">OpenClaw</h1> <p class="muted" id="oc-summary" style="margin: 0 0 1.5rem; color: var(--text-2);">Loading…</p> <section class="card"> <header class="card-header"> <h2>Named agents</h2> <label>Window
<select id="oc-window"> <option value="today">today</option> <option value="7d" selected>7d</option> <option value="30d">30d</option> <option value="all">all</option> </select> </label> </header> <table class="data-table"> <thead><tr><th>Name</th><th class="num">Sessions</th><th class="num">Tokens</th><th class="num">Cost (reported)</th><th>Last active</th></tr></thead> <tbody id="oc-named-agents"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody> </table> </section> <section class="card" style="margin-top: 1.5rem;"> <header class="card-header"><h2>Providers</h2></header> <table class="data-table"> <thead><tr><th>Provider</th><th class="num">Models</th><th class="num">Sessions</th><th class="num">Tokens</th><th class="num">Cost</th></tr></thead> <tbody id="oc-providers"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody> </table> </section> <script type="module">
    import { num as fmtNum, usd as fmtUsd, tok as fmtTok, ago as fmtRelative } from '/scripts/format.js';

    const windowSel = document.getElementById('oc-window');
    const namedBody = document.getElementById('oc-named-agents');
    const provBody = document.getElementById('oc-providers');
    const summary = document.getElementById('oc-summary');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function refresh() {
      const w = windowSel.value;
      const [na, pr] = await Promise.all([
        fetch('/api/agents/openclaw/named-agents?window=' + w).then(r => r.json()),
        fetch('/api/agents/openclaw/providers?window=' + w).then(r => r.json()),
      ]);

      if (!na.named_agents || na.named_agents.length === 0) {
        namedBody.innerHTML = '<tr><td colspan="5" class="muted">No OpenClaw activity in this window.</td></tr>';
      } else {
        namedBody.innerHTML = na.named_agents.map(a => `
          <tr>
            <td><a href="/sessions?agent=openclaw&backend_agent=${encodeURIComponent(a.name)}">${escapeHtml(a.name)}</a></td>
            <td class="num">${fmtNum(a.sessions)}</td>
            <td class="num">${fmtTok(a.tokens)}</td>
            <td class="num">${fmtUsd(a.cost_usd)}</td>
            <td>${a.last_active ? fmtRelative(a.last_active) : '—'}</td>
          </tr>`).join('');
      }

      if (!pr.providers || pr.providers.length === 0) {
        provBody.innerHTML = '<tr><td colspan="5" class="muted">No provider data in this window.</td></tr>';
      } else {
        provBody.innerHTML = pr.providers.map(p => `
          <tr>
            <td>${escapeHtml(p.provider)}</td>
            <td class="num">${fmtNum(p.models)}</td>
            <td class="num">${fmtNum(p.sessions)}</td>
            <td class="num">${fmtTok(p.tokens)}</td>
            <td class="num">${fmtUsd(p.cost_usd)}</td>
          </tr>`).join('');
      }

      const totalSessions = (na.named_agents ?? []).reduce((a, x) => a + x.sessions, 0);
      const totalTokens = (na.named_agents ?? []).reduce((a, x) => a + x.tokens, 0);
      const totalCost = (na.named_agents ?? []).reduce((a, x) => a + x.cost_usd, 0);
      const namedCount = (na.named_agents ?? []).length;
      summary.textContent = `Last ${w} · ${namedCount} named agents · ${fmtNum(totalSessions)} sessions · ${fmtTok(totalTokens)} tokens · ${fmtUsd(totalCost)} reported`;
    }
    windowSel.addEventListener('change', refresh);
    refresh();
  </script> </main> <footer class="app-footer" id="footer"> <span class="status-pill" id="ingest-status">Loading…</span> <span style="margin: 0 0.8rem;">·</span> <span id="filter-label"></span> <span style="margin: 0 0.8rem;">·</span> <span id="pricing-info">Pricing —</span> </footer> <script type="module">
    import { getFilter, setFilter, loadAgents } from '/scripts/agents.js';

    // ─── Status footer (existing behavior) ───────────────────────────
    async function refreshStatus() {
      try {
        const [p, s] = await Promise.all([
          fetch('/api/pricing').then(r => r.json()),
          fetch('/api/ingest/status').then(r => r.json()),
        ]);
        const pf = document.getElementById('pricing-info');
        if (pf) pf.innerHTML = `Costs estimated from pricing table v<code>${p.version}</code> — tokens are exact; <code>argus pricing refresh</code> to update`;
        const ip = document.getElementById('ingest-status');
        if (ip) {
          if (s.foregroundComplete && s.pending === 0) {
            const n = typeof s.sessionCount === 'number' ? s.sessionCount : s.processed;
            ip.textContent = `Tracking ${n} sessions`;
            ip.classList.remove('busy');
          } else if (!s.foregroundComplete) {
            ip.textContent = `Ingesting recent... ${s.processed}/${s.total}`;
            ip.classList.add('busy');
          } else {
            ip.textContent = `Backfilling history... ${s.processed}/${s.total}`;
            ip.classList.add('busy');
          }
        }
      } catch (e) { /* server may not be live yet */ }
    }
    refreshStatus();
    setInterval(refreshStatus, 4000);

    // ─── Agents nav dropdown ──────────────────────────────────────────
    async function renderAgentsNav() {
      try {
        const agents = await loadAgents();
        const menu = document.getElementById('agents-menu');
        if (!menu) return;
        if (!agents.length) {
          menu.innerHTML = '<span class="nav-dropdown-empty">No agents registered</span>';
          return;
        }
        menu.innerHTML = agents
          .map(a => `<a href="${a.page_path}">${escapeHtml(a.display_name)}</a>`)
          .join('');
      } catch { /* no-op */ }
    }
    renderAgentsNav();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ─── Agent picker (global filter) ─────────────────────────────────
    const wrapper = document.getElementById('agent-picker-wrapper');
    const onAgentPage = wrapper && wrapper.getAttribute('data-on-agent-page') === '1';
    if (onAgentPage && wrapper) {
      // On per-agent pages, the page is inherently scoped; the picker would mislead.
      wrapper.hidden = true;
    }

    function describeFilter(f, agentsById) {
      if (!f.agent && !f.backendAgent) return 'All';
      const display = agentsById[f.agent]?.display_name ?? f.agent;
      return f.backendAgent ? `${display} / ${f.backendAgent}` : display;
    }

    async function renderPicker() {
      const toggle = document.getElementById('agent-picker-toggle');
      const menu = document.getElementById('agent-picker-menu');
      const label = document.getElementById('agent-picker-label');
      const filterLabel = document.getElementById('filter-label');
      if (!toggle || !menu || !label) return;
      let agents = [];
      try { agents = await loadAgents(); } catch { /* keep empty */ }
      const agentsById = Object.fromEntries(agents.map(a => [a.name, a]));
      const f = getFilter();
      const desc = describeFilter(f, agentsById);
      label.textContent = `Agent: ${desc}`;
      if (filterLabel) {
        filterLabel.innerHTML = (f.agent || f.backendAgent)
          ? `filtered: <strong>${escapeHtml(desc)}</strong>`
          : '';
      }

      // Build menu items: "All" + each agent + each agent's backend_agents.
      const items = [];
      items.push({ label: 'All', value: {} });
      for (const a of agents) {
        items.push({ label: a.display_name, value: { agent: a.name } });
        if (Array.isArray(a.backend_agents) && a.backend_agents.length) {
          for (const b of a.backend_agents) {
            items.push({ label: `↳ ${b}`, value: { agent: a.name, backendAgent: b }, indented: true });
          }
        }
      }
      menu.innerHTML = items.map((it, i) => {
        const active = (it.value.agent ?? null) === (f.agent ?? null)
          && (it.value.backendAgent ?? null) === (f.backendAgent ?? null);
        return `<button class="agent-picker-option ${it.indented ? 'indented' : ''} ${active ? 'active' : ''}" data-idx="${i}">${escapeHtml(it.label)}</button>`;
      }).join('');
      menu.querySelectorAll('button.agent-picker-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-idx'));
          setFilter(items[idx].value);
          menu.hidden = true;
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }
    renderPicker();

    const pickerToggle = document.getElementById('agent-picker-toggle');
    const pickerMenu = document.getElementById('agent-picker-menu');
    if (pickerToggle && pickerMenu) {
      pickerToggle.addEventListener('click', () => {
        const open = pickerMenu.hidden;
        pickerMenu.hidden = !open;
        pickerToggle.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', (e) => {
        if (!pickerMenu.contains(e.target) && e.target !== pickerToggle) {
          pickerMenu.hidden = true;
          pickerToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // When the filter changes, re-render the label + tell every page to refresh.
    window.addEventListener('argus:filter-changed', () => { renderPicker(); });
  </script> </body> </html>
